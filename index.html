<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#143B5F"/>
  <meta name="description" content="Gestión de producción por perfiles conectada a Google Sheets."/>
  <link rel="manifest" href="./manifest.webmanifest"/>
  <link rel="icon" href="./icons/icon-192.png"/>
  <link rel="apple-touch-icon" href="./icons/icon-192.png"/>
  <link rel="stylesheet" href="./styles.css"/>
  <title>Prioridad Producción</title>
</head>
<body>
  <div class="app-shell">
    <section id="login-view" class="unlock-screen">
      <img src="./icons/icon-192.png" alt="" class="unlock-logo"/>
      <p class="eyebrow">PAPELERÍA CREATIVA</p>
      <h1>Prioridad<br/>Producción</h1>
      <p class="unlock-copy">Ingresa a tu espacio personal de trabajo.</p>
      <form id="login-form" class="unlock-form">
        <label for="login-name">Tu nombre</label>
        <input id="login-name" autocomplete="username" placeholder="Ej. Valentina" required/>
        <label for="login-pin">Tu PIN personal</label>
        <input id="login-pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Seis dígitos" required/>
        <button class="primary-button">Iniciar sesión</button>
        <p id="login-error" class="form-error"></p>
      </form>
    </section>

    <section id="workspace" class="workspace hidden">
      <header class="topbar">
        <div>
          <p id="role-label" class="eyebrow">PRODUCCIÓN</p>
          <h1 id="screen-title">Ahora</h1>
        </div>
        <!-- Botón conectado directamente a la función de refresco -->
        <button id="refresh" class="icon-button" aria-label="Actualizar" onclick="refrescarModuloWeb()">↻</button>
      </header>
      <main id="screen" class="screen" aria-live="polite"></main>
      <nav class="bottom-nav">
        <button data-screen="now" class="nav-button active"><span>⌁</span>Ahora</button>
        <button data-screen="queue" class="nav-button"><span>☷</span>Mi cola</button>
        <button data-screen="team" class="nav-button"><span>⚠</span>Equipo</button>
        <button data-screen="history" class="nav-button"><span>▣</span>Historial</button>
        <button data-screen="settings" class="nav-button"><span>⚙</span>Ajustes</button>
      </nav>
    </section>
  </div>

  <dialog id="modal" class="modal"></dialog>
  <div id="toast" class="toast" role="status"></div>

  <script src="./config.js"></script>
  <script src="./firebase-config.js"></script>
  <script type="module" src="./app-registrar-fix.js?v=14"></script>

  <script>
    const URL_WEB_APP = "https://script.google.com/macros/s/AKfycby_mIt5VzEOZjKb6znpYXH_T0Q0jJfEqr5UB1Z8l0JpUiHfEC9CuRuK9z2s_Q3lNl6www/exec";

    // 1. Refrescar módulos desde GitHub Pages hacia Apps Script
    async function refrescarModuloWeb() {
      const btnRefresh = document.getElementById("refresh");
      if (btnRefresh) btnRefresh.style.opacity = "0.5";

      try {
        const respuesta = await fetch(URL_WEB_APP, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            accion: "refrescarModulo",
            modulo: document.getElementById("screen-title")?.innerText || "now"
          })
        });

        const datos = await respuesta.json();

        if (datos.exito) {
          console.log("Datos recibidos:", datos.datos);
          if (typeof window.cargarDatos === "function") {
            window.cargarDatos();
          } else {
            location.reload();
          }
        } else {
          alert("Atención: " + datos.mensaje);
        }
      } catch (error) {
        console.error("Error de conexión:", error);
        alert("Error al conectar con Google Sheets.");
      } finally {
        if (btnRefresh) btnRefresh.style.opacity = "1";
      }
    }

    // 2. Enviar cierre de orden usando fetch (sin google.script.run)
    window.enviarCierreOrden = async function(idOrden, comentario, fotosArray) {
      const btnCerrar = document.getElementById("btnConfirmarCierre");
      if (btnCerrar) {
        btnCerrar.disabled = true;
        btnCerrar.innerText = "Guardando en Sheets...";
      }

      const payload = {
        accion: "cerrarOrdenConFotos",
        idOrden: idOrden || document.getElementById("inputOrdenId")?.value,
        comentario: comentario || document.getElementById("inputComentarioCierre")?.value || "",
        fotos: fotosArray || (window.fotosBase64Array ? window.fotosBase64Array : [])
      };

      try {
        const respuesta = await fetch(URL_WEB_APP, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload)
        });

        const response = await respuesta.json();

        if (btnCerrar) {
          btnCerrar.disabled = false;
          btnCerrar.innerText = "Cerrar Orden";
        }

        if (response && response.exito) {
          alert("¡Orden cerrada correctamente!");
          const modal = document.getElementById("modal");
          if (modal) modal.close();
          refrescarModuloWeb();
        } else {
          alert("Error al guardar: " + (response ? response.mensaje : "Sin respuesta del servidor."));
        }
      } catch (err) {
        if (btnCerrar) {
          btnCerrar.disabled = false;
          btnCerrar.innerText = "Reintentar Cierre";
        }
        alert("Error de comunicación con Google Sheets: " + err.message);
      }
    };
  </script>
</body>
</html>
