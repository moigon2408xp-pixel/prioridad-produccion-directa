<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#143B5F" />
    <meta name="description" content="Cola y prioridades de producción conectadas a Google Sheets." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Prioridad Producción</title>
  </head>
  <body>
    <div id="app" class="app-shell">
      <section id="unlock" class="unlock-screen">
        <img src="./icons/icon-192.png" alt="Prioridad Producción" class="unlock-logo" />
        <p class="eyebrow">PAPELERÍA CREATIVA</p>
        <h1>Prioridad<br />Producción</h1>
        <p class="unlock-copy">Tu turno, tus pendientes y los pedidos que necesitan ayuda.</p>
        <form id="unlock-form" class="unlock-form">
          <label for="team-pin">Código del equipo</label>
          <input id="team-pin" type="password" autocomplete="current-password" inputmode="numeric" placeholder="Ingresa el código" required />
          <button type="submit" class="primary-button">Entrar a producción</button>
          <p id="unlock-error" class="form-error" role="alert"></p>
        </form>
      </section>
      <section id="workspace" class="workspace hidden">
        <header class="topbar">
          <div><p class="eyebrow">PRIORIDAD PRODUCCIÓN</p><h1 id="screen-title">Ahora</h1></div>
          <button id="refresh" class="icon-button" aria-label="Actualizar pedidos">↻</button>
        </header>
        <main id="screen" class="screen" aria-live="polite"></main>
        <nav class="bottom-nav" aria-label="Navegación principal">
          <button data-screen="now" class="nav-button active"><span>⌁</span>Ahora</button>
          <button data-screen="queue" class="nav-button"><span>☷</span>Mi cola</button>
          <button data-screen="team" class="nav-button"><span>⚠</span>Equipo</button>
          <button data-screen="settings" class="nav-button"><span>⚙</span>Ajustes</button>
        </nav>
      </section>
    </div>
    <dialog id="modal" class="modal"></dialog>
    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
