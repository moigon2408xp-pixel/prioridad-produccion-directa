<!doctype html>
<html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#143B5F"/><meta name="description" content="Gestión de producción por perfiles conectada a Google Sheets."/><link rel="manifest" href="./manifest.webmanifest"/><link rel="icon" href="./icons/icon-192.png"/><link rel="apple-touch-icon" href="./icons/icon-192.png"/><link rel="stylesheet" href="./styles.css"/><title>Prioridad Producción</title></head><body>
<div class="app-shell"><section id="login-view" class="unlock-screen"><img src="./icons/icon-192.png" alt="" class="unlock-logo"/><p class="eyebrow">PAPELERÍA CREATIVA</p><h1>Prioridad<br/>Producción</h1><p class="unlock-copy">Ingresa a tu espacio personal de trabajo.</p><form id="login-form" class="unlock-form"><label for="login-name">Tu nombre</label><input id="login-name" autocomplete="username" placeholder="Ej. Valentina" required/><label for="login-pin">Tu PIN personal</label><input id="login-pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Seis dígitos" required/><button class="primary-button">Iniciar sesión</button><p id="login-error" class="form-error"></p></form></section>
<section id="workspace" class="workspace hidden"><header class="topbar"><div><p id="role-label" class="eyebrow">PRODUCCIÓN</p><h1 id="screen-title">Ahora</h1></div><button id="refresh" class="icon-button" aria-label="Actualizar">↻</button></header><main id="screen" class="screen" aria-live="polite"></main><nav class="bottom-nav"><button data-screen="now" class="nav-button active"><span>⌁</span>Ahora</button><button data-screen="queue" class="nav-button"><span>☷</span>Mi cola</button><button data-screen="team" class="nav-button"><span>⚠</span>Equipo</button><button data-screen="settings" class="nav-button"><span>⚙</span>Ajustes</button></nav></section></div><dialog id="modal" class="modal"></dialog><div id="toast" class="toast" role="status"></div><script src="./config.js"></script><script type="module" src="./app.js"></script></body></html>
