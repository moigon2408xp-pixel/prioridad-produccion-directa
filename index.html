<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#1e3a8a"/>
  <meta name="description" content="Gestión de producción por perfiles conectada a Google Sheets."/>
  <link rel="manifest" href="./manifest.webmanifest"/>
  <link rel="icon" href="./icons/icon-192.png"/>
  <link rel="apple-touch-icon" href="./icons/icon-192.png"/>
  <link rel="stylesheet" href="./styles.css"/>
  <title>Prioridad Producción - Papelería Creativa</title>
</head>
<body>
  <div class="app-shell">
    <!-- VISTA DE DESBLOQUEO / INICIO DE SESIÓN -->
    <section id="login-view" class="unlock-screen">
      <img src="./icons/icon-192.png" alt="Logo" class="unlock-logo"/>
      <p class="eyebrow">PAPELERÍA CREATIVA</p>
      <h1>Prioridad<br/>Producción</h1>
      <p class="unlock-copy">Ingresa a tu espacio personal de trabajo.</p>
      <form id="login-form" class="unlock-form">
        <label for="login-name">Tu nombre</label>
        <input id="login-name" autocomplete="username" placeholder="Ej. Valentina" required/>
        <label for="login-pin">Tu PIN personal</label>
        <input id="login-pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Seis dígitos" required/>
        <button class="primary-button">Iniciar sesión</button>
        <p id="login-error" class="form-error"></p>
      </form>
    </section>

    <!-- VISTA DE ÁREA DE TRABAJO -->
    <section id="workspace" class="workspace hidden">
      <header class="topbar">
        <div>
          <p id="role-label" class="eyebrow">PRODUCCIÓN</p>
          <h1 id="screen-title">Ahora</h1>
        </div>
        <div class="topbar-controls">
          <button type="button" class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Cambiar Tema Modo Oscuro/Claro">
            <span id="theme-icon">🌙</span> Modo
          </button>
          <button id="refresh" class="icon-button" aria-label="Actualizar">↻</button>
        </div>
      </header>

      <!-- CONTROL DE COPIAS DE SEGURIDAD INTEGRADO EN WORKSPACE -->
      <div class="backup-container" style="padding: 12px 16px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; background: var(--bg-card); border-radius: var(--radius-md); border: 1px solid var(--border-color);">
        <button type="button" onclick="exportarBackup()" style="padding: 8px 14px; background-color: var(--primary-color); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">
          📦 Exportar Copia de Seguridad
        </button>
        <label style="padding: 8px 14px; background-color: var(--bg-main); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 8px; font-weight: bold; cursor: pointer; display: inline-block;">
          📥 Importar Copia de Seguridad
          <input type="file" id="importInput" accept=".json" onchange="importarBackup(event)" style="display: none;">
        </label>
      </div>

      <main id="screen" class="screen" aria-live="polite"></main>

      <nav class="bottom-nav">
        <button data-screen="now" class="nav-button active"><span>⌁</span>Ahora</button>
        <button data-screen="queue" class="nav-button"><span>☷</span>Mi cola</button>
        <button data-screen="team" class="nav-button"><span>⚠</span>Equipo</button>
        <button data-screen="history" class="nav-button"><span>▣</span>Historial</button>
        <button data-screen="settings" class="nav-button"><span>⚙</span>Ajustes</button>
      </nav>
    </section>
  </div>

  <dialog id="modal" class="modal"></dialog>
  <div id="toast" class="toast" role="status"></div>

  <script src="./config.js"></script>
  <script src="./firebase-config.js"></script>
  <script type="module" src="./app-registrar-fix.js?v=21"></script>

  <script>
    // FUNCIONES GLOBALES DE RESPALDO Y RESTAURACIÓN DE LOCALSTORAGE
    window.exportarBackup = function() {
      const datos = {};
      for (let i = 0; i < localStorage.length; i++) {
        const clave = localStorage.key(i);
        datos[clave] = localStorage.getItem(clave);
      }
      if (Object.keys(datos).length === 0) {
        alert("No hay ningún dato guardado en la aplicación para exportar.");
        return;
      }
      const blob = new Blob([JSON.stringify(datos, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const enlace = document.createElement("a");
      const fecha = new Date().toISOString().split("T")[0];
      enlace.href = url;
      enlace.download = `respaldo_papeleria_produccion_${fecha}.json`;
      document.body.appendChild(enlace);
      enlace.click();
      document.body.removeChild(enlace);
      URL.revokeObjectURL(url);
    };

    window.importarBackup = function(event) {
      const archivo = event.target.files[0];
      if (!archivo) return;
      const lector = new FileReader();
      lector.onload = function(e) {
        try {
          const datos = JSON.parse(e.target.result);
          for (const clave in datos) {
            localStorage.setItem(clave, datos[clave]);
          }
          alert("¡Copia de seguridad restaurada con éxito! La página se actualizará.");
          window.location.reload();
        } catch (error) {
          alert("Error: El archivo seleccionado no tiene un formato JSON válido.");
        }
      };
      lector.readAsText(archivo);
    };
  </script>
</body>
</html>
