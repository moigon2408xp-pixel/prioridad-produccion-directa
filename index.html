<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#1a1a2e"/>
  <meta name="description" content="Sistema de gestión de producción para Creaciones JJ – Ochoa & Risquez."/>
  <link rel="manifest" href="./manifest.webmanifest?v=39"/>
  <link rel="icon" type="image/png" href="./logo_creaciones_jj.png"/>
  <link rel="apple-touch-icon" href="./logo_creaciones_jj.png"/>
  <link rel="stylesheet" href="./styles.css?v=43"/>
  <title>Creaciones JJ – Prioridad Producción</title>
  <!-- CSS crítico: oculta workspace ANTES de que corra cualquier JS -->
  <style>
    #workspace { display: none; }
    #login-view { display: flex; }
  </style>
</head>
<body>
  <div class="app-shell">

    <!-- ========== PANTALLA DE LOGIN ========== -->
    <section id="login-view" class="unlock-screen">

      <!-- Fondo decorativo con gradiente de la marca -->
      <div class="login-bg-decor" aria-hidden="true">
        <div class="login-bg-circle login-bg-circle--1"></div>
        <div class="login-bg-circle login-bg-circle--2"></div>
      </div>

      <!-- Logo de la empresa -->
      <div class="login-logo-wrapper">
        <img
          src="./logo_creaciones_jj.png"
          alt="Creaciones JJ"
          class="login-logo"
          onerror="this.src='./icons/icon-192.png'"
        />
      </div>

      <!-- Nombre de la empresa -->
      <div class="login-brand">
        <p class="login-brand-sub">Sistema de Producción</p>
        <h1 class="login-brand-name">Creaciones JJ</h1>
        <p class="login-brand-tag">Ochoa &amp; Risquez</p>
      </div>

      <!-- Formulario de inicio de sesión -->
      <form id="login-form" class="unlock-form" onsubmit="event.preventDefault(); return false;">
        <label for="login-name">Tu nombre</label>
        <input
          id="login-name"
          autocomplete="username"
          placeholder="Ej. Valentina"
          required
        />
        <label for="login-pin">Tu PIN personal</label>
        <input
          id="login-pin"
          type="password"
          inputmode="numeric"
          autocomplete="current-password"
          placeholder="Seis dígitos"
          required
        />
        <button type="button" id="login-btn-manual" class="primary-button login-submit-btn">
          Iniciar sesión
        </button>
        <p id="login-error" class="form-error"></p>
      </form>

      <p class="login-footer-copy">
        © Creaciones JJ – Ochoa &amp; Risquez · Gestión de Producción
      </p>
    </section>

    <!-- ========== ÁREA DE TRABAJO ========== -->
    <section id="workspace" class="workspace">
      <header class="topbar">
        <div>
          <p id="role-label" class="eyebrow">CREACIONES JJ · PRODUCCIÓN</p>
          <h1 id="screen-title">Ahora</h1>
        </div>
        <div class="topbar-controls">
          <button
            type="button"
            class="theme-toggle-btn"
            onclick="toggleTheme()"
            aria-label="Cambiar modo oscuro / claro"
          >
            <span id="theme-icon">🌙</span> Modo
          </button>
          <button id="refresh" class="icon-button" aria-label="Actualizar">↻</button>
        </div>
      </header>

      <!-- Copia de Seguridad -->
      <div class="backup-container">
        <button type="button" onclick="exportarBackup()">
          📦 Exportar Copia de Seguridad
        </button>
        <label>
          📥 Importar Copia de Seguridad
          <input
            type="file"
            id="importInput"
            accept=".json"
            onchange="importarBackup(event)"
            style="display:none;"
          />
        </label>
      </div>

      <main id="screen" class="screen" aria-live="polite"></main>

      <nav id="app-nav" class="bottom-nav">
        <button data-screen="now"       class="nav-button active"><span>⌁</span>Ahora</button>
        <button data-screen="queue"     class="nav-button"><span>☷</span>Mi Bandeja</button>
        <button data-screen="team"      class="nav-button"><span>⚠</span>Equipo</button>
        <button data-screen="history"   class="nav-button"><span>▣</span>Historial</button>
        <button data-screen="schedules" class="nav-button"><span>📅</span>Horarios</button>
        <button data-screen="finances"  class="nav-button nav-lead-only" style="display:none;"><span>💵</span>Finanzas</button>
        <button data-screen="settings"  class="nav-button"><span>⚙</span>Ajustes</button>
      </nav>
    </section>
  </div>

  <dialog id="modal" class="modal"></dialog>
  <div id="toast" class="toast" role="status"></div>

  <script src="./firebase-config.js"></script>
  <script type="module" src="./app-registrar-fix.js?v=48"></script>

  <script>
    /* ---- Backup / Restore desde localStorage ---- */
    window.exportarBackup = function () {
      const datos = {};
      for (let i = 0; i < localStorage.length; i++) {
        const clave = localStorage.key(i);
        datos[clave] = localStorage.getItem(clave);
      }
      if (!Object.keys(datos).length) {
        alert("No hay datos guardados para exportar.");
        return;
      }
      const blob = new Blob([JSON.stringify(datos, null, 2)], { type: "application/json" });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement("a");
      a.href     = url;
      a.download = `backup_creaciones_jj_${new Date().toISOString().split("T")[0]}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };

    window.importarBackup = function (event) {
      const archivo = event.target.files[0];
      if (!archivo) return;
      const lector = new FileReader();
      lector.onload = function (e) {
        try {
          const datos = JSON.parse(e.target.result);
          for (const k in datos) localStorage.setItem(k, datos[k]);
          alert("¡Copia restaurada! La página se actualizará.");
          window.location.reload();
        } catch {
          alert("El archivo no es un JSON válido.");
        }
      };
      lector.readAsText(archivo);
    };
  </script>
</body>
</html>
